{% extends "base.html" %}

{% block content %}
<h2>Register</h2>
<form method="post" action="{{ url_for('register') }}">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required>

    <label for="age">Age:</label>
    <input type="number" id="age" name="age" min="0" required>

    <div id="guardian-section" style="display: none;">
        <label for="guardian_name">Guardian Name:</label>
        <input type="text" id="guardian_name" name="guardian_name">

        <label for="guardian_relation">Guardian Relation:</label>
        <input type="text" id="guardian_relation" name="guardian_relation">
    </div>

    <label for="role">Role:</label>
    <select id="role" name="role" required>
        <option value="user">User</option>
        <option value="instructor">Instructor</option>
        <option value="parent">Parent</option>
    </select>

    <div id="city-section" style="display: none;">
        <label for="cities">Available Cities:</label>
        <select id="cities" name="cities" multiple>
            <option value="Montreal">Montreal</option>
            <option value="Laval">Laval</option>
            <option value="Quebec City">Quebec City</option>
            <option value="Sherbrooke">Sherbrooke</option>
        </select>
        <p>Hold down the Ctrl (Windows) / Command (Mac) key to select multiple options.</p>
    </div>

    <button type="submit">Register</button>
</form>

<script>
    const roleSelect = document.getElementById('role');
    const citySection = document.getElementById('city-section');
    const ageInput = document.getElementById('age');
    const guardianSection = document.getElementById('guardian-section');

    // Show or hide the city section based on the selected role
    roleSelect.addEventListener('change', () => {
        if (roleSelect.value === 'instructor') {
            citySection.style.display = 'block';
        } else {
            citySection.style.display = 'none';
        }
    });

    // Show or hide the guardian section based on the age input
    ageInput.addEventListener('input', () => {
        if (ageInput.value < 18) {
            guardianSection.style.display = 'block';
        } else {
            guardianSection.style.display = 'none';
        }
    });
</script>
{% endblock %}
