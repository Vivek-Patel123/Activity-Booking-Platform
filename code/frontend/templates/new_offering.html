<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create New Offering</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    {% include '_header.html' %}
    <div class="content-container">
        <h1>Create New Offering</h1>
        <form method="POST" action="{{ url_for('new_offering') }}">
            <label for="title">Title:</label>
            <input type="text" id="title" name="title" required><br>

            <label for="location">Location:</label>
            <input type="text" id="location" name="location" required><br>

            <label for="city">City:</label>
            <input type="text" id="city" name="city" required><br>

            <label for="time_start">Start Time:</label>
            <input type="time" id="time_start" name="time_start" required><br>
        
            <label for="time_end">End Time:</label>
            <input type="time" id="time_end" name="time_end" required><br>

            <label for="lesson_type">Lesson Type:</label>
            <select id="lesson_type" name="lesson_type" required>
                <option value="private">Private</option>
                <option value="group">Group</option>
            </select><br>

            <label for="max_participants">Max Participants (if group):</label>
            <input type="number" id="max_participants" name="max_participants"><br>

            <label for="start_date">Start Date:</label>
            <input type="date" id="start_date" name="start_date" required><br>

            <label for="end_date">End Date:</label>
            <input type="date" id="end_date" name="end_date" required><br>

            <button type="submit">Create Offering</button>
        </form>
    </div>
</body>
</html>
